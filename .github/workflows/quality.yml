name: CCNA Lab AI quality gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete source import
        run: |
          test -f package.json
          test -f package-lock.json
          test -f next.config.mjs
          test -f lib/labs.ts
          test -f app/page.tsx
      - name: Check for accidentally committed environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)(node_modules|\.next)/'; then
            echo 'Blocked: environment files or generated artifacts tracked'
            exit 1
          fi
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and regression tests
        run: npm test
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Production build (Webpack)
        run: npm run build
      - name: Install isolated browser QA tools
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Mobile and desktop UI acceptance (API fixtures)
        run: node --experimental-strip-types scripts/verify-ui.mjs
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccna-ui-acceptance
          path: ui-artifacts/
          if-no-files-found: ignore
